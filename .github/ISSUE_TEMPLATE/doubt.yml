name: ❓ Ask a doubt
description: Stuck on a lesson or an assignment? Ask here.
title: "[Doubt] "
labels: ["doubt", "needs-mentor"]
body:
  - type: markdown
    attributes:
      value: |
        No such thing as a stupid question here. Fill this in and a mentor — or another
        student — will get back to you.

        **Search first:** someone may have already asked. [Browse open doubts](https://github.com/RishiR123/MITRA-Students/issues?q=is%3Aissue+label%3Adoubt)

  - type: dropdown
    id: module
    attributes:
      label: Which module?
      options:
        - Module 1 — ANN Regression
        - General / not module-specific
    validations:
      required: true

  - type: input
    id: lesson
    attributes:
      label: Which lesson?
      description: Lesson title or number, if it's about a specific video.
      placeholder: "1.1 — ANN Regression"

  - type: textarea
    id: question
    attributes:
      label: What's your question?
      description: Be as specific as you can.
      placeholder: |
        I don't understand why `git merge` created a commit here but not in the video.
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What have you already tried?
      description: Even "I re-watched it twice and read the docs" helps.
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Relevant code or error message
      description: Paste it here. It'll be formatted automatically.
      render: shell

  - type: input
    id: env
    attributes:
      label: Your setup
      placeholder: "macOS 15, Python 3.12, VS Code"
