name: 🖥️ Course site bug
description: Something is broken on the LMS site itself.
title: "[Site] "
labels: ["site", "bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the course site
        2. Click Module 3
        3. Click lesson 3.2
        4. Player shows a blank box
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: "Chrome 140 on Android / Safari on iPhone 14"
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag an image in here if you have one.
