<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MITRA — Course</title>
  <meta name="description" content="MITRA student learning platform: video lessons, module projects, and pull-request submissions.">
  <meta name="color-scheme" content="dark light">

  <meta property="og:title" content="MITRA — Learn by watching. Prove it by shipping.">
  <meta property="og:description" content="Video-based learning with project submissions reviewed as pull requests.">
  <meta property="og:type" content="website">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%236d8cff'/><text x='50' y='68' font-size='54' font-family='system-ui,sans-serif' font-weight='800' fill='white' text-anchor='middle'>M</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <button class="icon-btn" id="menu-btn" aria-label="Toggle lesson navigation">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M3 6h18M3 12h18M3 18h18"/>
      </svg>
    </button>

    <a class="brand" href="#/">
      <span class="brand-mark">M</span>
      MITRA
      <span class="brand-sub">Learn by watching. Prove it by shipping.</span>
    </a>

    <span class="header-spacer"></span>

    <a class="ghost-btn" href="https://github.com/RishiR123/MITRA-Students/blob/main/CONTRIBUTING.md" target="_blank" rel="noopener">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/>
        <path d="M6 8.5v7M8.5 6H14a3 3 0 0 1 3 3v6.5"/>
      </svg>
      Submit work
    </a>

    <a class="icon-btn" href="https://github.com/RishiR123/MITRA-Students" target="_blank" rel="noopener" aria-label="Open the repository on GitHub">
      <svg width="17" height="17" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
      </svg>
    </a>

    <button class="icon-btn" id="theme-btn" aria-label="Switch theme">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
    </button>
  </header>

  <nav id="sidebar" aria-label="Lessons">
    <div class="sidebar-top">
      <div class="overall">
        <span>Your progress</span>
        <span id="overall-pct">0 / 0</span>
      </div>
      <div class="bar"><i id="overall-bar" style="width:0%"></i></div>

      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
        </svg>
        <input id="search" type="search" placeholder="Search lessons…  (press /)" autocomplete="off" aria-label="Search lessons">
      </div>
    </div>

    <div id="toc"></div>
  </nav>

  <div id="backdrop"></div>

  <main id="main">
    <div class="wrap"><p style="color:var(--text-faint)">Loading the course…</p></div>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
